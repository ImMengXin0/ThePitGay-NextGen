name: High migration build

on:
  push:
    branches: [ThePitGay-High]
  pull_request:
    branches: [ThePitGay-High]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify read-only entity UUID scanner
        run: python -m unittest discover -s scripts -p 'test_scan_entity_uuids.py' -v
      - name: Build and run all automated checks
        run: bash gradlew build :core:paperLibrarySmoke --continue --console=plain "-Dorg.gradle.java.installations.paths=$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-test-reports
          path: |
            core/build/reports/tests/
            paper-platform/build/reports/tests/
            vendor/mythic-framework/*/build/reports/tests/
            core/build/paper-library-smoke/result.txt
      - name: Save plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ThePitGay-High
          path: core/build/libs/ThePitGay-High.jar
